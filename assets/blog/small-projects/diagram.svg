<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">从想法到项目的路径</title>
  <desc id="desc">四个节点组成的项目制作流程图。</desc>
  <rect width="960" height="420" rx="24" fill="#081633"/>
  <g stroke="#77e6ff" stroke-width="2" fill="none" opacity=".65">
    <path d="M90 210 H870" stroke-dasharray="6 12"/>
    <path d="M210 210 L330 210 M450 210 L570 210 M690 210 L810 210"/>
  </g>
  <g fill="#0f2854" stroke="#77e6ff" stroke-width="3">
    <circle cx="150" cy="210" r="58"/><circle cx="390" cy="210" r="58"/><circle cx="630" cy="210" r="58"/><circle cx="870" cy="210" r="58"/>
  </g>
  <g fill="#d9faff" font-family="monospace" font-size="18" text-anchor="middle" letter-spacing="2">
    <text x="150" y="216">IDEA</text><text x="390" y="216">BUILD</text><text x="630" y="216">TEST</text><text x="870" y="216">SHARE</text>
  </g>
  <g fill="#77e6ff" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="150" y="310">定义问题</text><text x="390" y="310">最小版本</text><text x="630" y="310">真实反馈</text><text x="870" y="310">留下记录</text>
  </g>
</svg>
