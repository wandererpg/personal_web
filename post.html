<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050816">
    <meta name="description" content="Wanderer 的博客文章。">
    <title>Blog article · Wanderer.OS</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script src="clock.js" defer></script>
    <script src="liquid-glass.js" defer></script>
    <script src="blog.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="index.html" aria-label="Wanderer.OS 首页">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>WANDERER<span>.OS</span></span>
          </a>

          <div class="header-status" aria-label="当前北京时间">
            <time class="header-status__date" data-current-date datetime="2026-09-06T00:00:00+08:00">2026.09.06 · 周日</time>
            <time class="header-status__time" data-current-time>00:00:00</time>
          </div>

          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航菜单">
            <span aria-hidden="true"></span>
          </button>

          <nav class="site-nav" id="site-nav" aria-label="主要导航">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="notes.html" aria-current="page">Blog</a>
            <a href="index.html#links">Comms</a>
          </nav>
        </div>
      </header>

      <aside class="music-player liquid-glass" data-liquid-glass data-music-player aria-label="星际音乐播放器">
        <div class="music-player__main">
          <button class="music-player__toggle" type="button" data-music-toggle aria-pressed="false" aria-label="播放背景音乐">
            <span class="music-player__disc" aria-hidden="true"><span></span></span>
          </button>
          <div class="music-player__copy">
            <strong data-music-title>夜の向日葵</strong>
            <span class="music-player__status" data-music-status aria-live="polite">选择曲目 · 点击播放</span>
          </div>
          <div class="music-player__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <label class="music-player__select-wrap">
          <span class="music-player__select-label">TRACK SELECT</span>
          <select class="music-player__select" data-music-select aria-label="选择音乐">
            <option value="0">花弁となり 世界は大いに歌う</option>
            <option value="1">夢の歩みを見上げて · 仰望梦想的脚步</option>
            <option value="2" selected>夜の向日葵</option>
            <option value="3">月の眼球譚</option>
          </select>
        </label>
        <audio class="music-player__audio" data-music-audio autoplay preload="metadata"></audio>
      </aside>

      <main id="main">
        <article class="blog-article container" data-blog-article aria-labelledby="blog-article-title">
          <a class="text-link blog-article__back" href="notes.html">← 返回博客</a>
          <div class="blog-article__hero">
            <span class="section-label" data-blog-article-category></span>
            <h1 id="blog-article-title" data-blog-article-title>载入文章…</h1>
            <p data-blog-article-excerpt></p>
            <div class="blog-article__meta">
              <time data-blog-article-date></time>
              <span data-blog-article-reading-time></span>
            </div>
            <div class="blog-article__cover" data-blog-article-cover aria-hidden="true"></div>
          </div>
          <div class="blog-article__content" data-blog-article-content></div>
          <p class="blog-error" data-blog-article-error role="status" hidden>文章暂时无法读取，请返回博客列表。</p>
          <nav class="blog-article__nav" aria-label="文章导航">
            <a data-blog-article-previous hidden></a>
            <a data-blog-article-next hidden></a>
          </nav>
        </article>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>© <span data-current-year>2026</span> WANDERER.OS / BLOG ARCHIVE</p>
          <p><a href="https://github.com/wandererpg" target="_blank" rel="noreferrer">GitHub</a> · <a href="https://space.bilibili.com/1065241718" target="_blank" rel="noreferrer">Bilibili</a></p>
        </div>
      </footer>
    </div>
  </body>
</html>
